; TRIDENT — PHP-FPM pool override
;
; Why this file exists:
;   The php:8.3-fpm-alpine base image ships with pm.max_children = 5, which is
;   fine for a single-user dev box but exhausts under any real concurrency:
;   while a few drivers were simultaneously uploading photos through the PWA
;   (each request pinning a worker for image compression + R2 upload), every
;   other Livewire request — including admin/dispatcher self-service password
;   changes — sat in the nginx fastcgi backlog waiting for a free worker, and
;   appeared to "hang" in the browser until fastcgi_read_timeout fired.
;
; Sizing assumptions:
;   ~50 MB RSS per worker (Laravel + Livewire + opcache shared) → 30 children
;   ≈ 1.5 GB peak. The host has plenty of headroom; raise further if you start
;   regularly seeing all 30 children busy in `ps`.
;
;   pm.max_requests recycles each worker after N requests so any slow memory
;   creep (notifications, image libs, PDF rendering) gets reclaimed without
;   needing a container restart.

[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500

; Surface FPM's own status if we ever need to debug pool saturation
; (sudo docker compose exec app sh -c "SCRIPT_NAME=/fpm-status SCRIPT_FILENAME=/fpm-status REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000")
pm.status_path = /fpm-status

; Slow-log any single PHP request that takes longer than 10s — useful for
; spotting future regressions where one endpoint silently holds a worker.
request_slowlog_timeout = 10s
slowlog = /var/log/php-fpm-slow.log

# ============================================================================
# PRODUCTION compose file. This is the default picked up by `docker compose`
# on the server. It builds a self-contained image (assets baked in at build
# time via Dockerfile) -- no bind mounts, no Vite dev server.
#
# Required .env keys (next to this file on the server):
#   APP_KEY=base64:...                 # generate once with `php artisan key:generate --show`
#   APP_URL=https://your.domain
#   DB_PASSWORD=...                    # must match what Postgres was init'd with
#
# Optional .env keys (defaults applied if unset):
#   APP_PORT=8091
#   DB_DATABASE=proselver  DB_USERNAME=proselver
#   MAIL_*, R2_*, R2_BACKUP_*
#
# Deploy:
#   git pull
#   docker compose build --no-cache app
#   docker compose up -d --force-recreate app scheduler queue
#
# For LOCAL development use docker-compose.dev.yml instead:
#   docker compose -f docker-compose.dev.yml up -d
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: proselver-app:latest
    container_name: proselver-app
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME:-TRIDENT}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://tcdc.co.za}
      - APP_KEY=${APP_KEY}
      - LOG_CHANNEL=stack
      - LOG_STACK=single
      - LOG_LEVEL=warning
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-proselver}
      - DB_USERNAME=${DB_USERNAME:-proselver}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - BROADCAST_CONNECTION=log
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@tcdc.co.za}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-TRIDENT Control & Dispatch Center}
      # Storage defaults to `local` so a freshly-deployed instance with
      # no R2 creds silently works on the local Docker volume instead of
      # 500-ing on every upload. Flip to `r2` in .env once R2_* are set
      # and confirmed via `php artisan storage:check --disk=r2`.
      - FILESYSTEM_DISK=${FILESYSTEM_DISK:-local}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_REGION=${R2_REGION:-auto}
      - R2_BACKUP_ACCESS_KEY_ID=${R2_BACKUP_ACCESS_KEY_ID:-}
      - R2_BACKUP_SECRET_ACCESS_KEY=${R2_BACKUP_SECRET_ACCESS_KEY:-}
      - R2_BACKUP_BUCKET=${R2_BACKUP_BUCKET:-}
      - R2_BACKUP_ENDPOINT=${R2_BACKUP_ENDPOINT:-}
      - R2_BACKUP_REGION=${R2_BACKUP_REGION:-auto}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-auto}
      - AWS_BUCKET=${AWS_BUCKET:-}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - AWS_USE_PATH_STYLE_ENDPOINT=${AWS_USE_PATH_STYLE_ENDPOINT:-false}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - COLLECTION_NOTE_PUBLIC_URL=${COLLECTION_NOTE_PUBLIC_URL:-}
      - LIVEWIRE_TEMPORARY_FILE_UPLOAD_DISK=public
      # TFN (TruckFuelNet) — powers /admin/fuel.  Both flags default to
      # OFF so a freshly-deployed instance without credentials silently
      # falls back to demo fixtures instead of 500-ing on every read.
      # Flip TFN_ENABLED=true + TFN_DEMO_MODE=false in host .env when
      # go-live credentials land; no image rebuild required after this
      # -- just `docker compose up -d --force-recreate app`.
      - TFN_ENABLED=${TFN_ENABLED:-false}
      - TFN_DEMO_MODE=${TFN_DEMO_MODE:-true}
      - TFN_BASE_URL=${TFN_BASE_URL:-https://api.tfn.co.za}
      - TFN_API_VERSION=${TFN_API_VERSION:-3}
      - TFN_CLIENT_ID=${TFN_CLIENT_ID:-customerAPI}
      - TFN_USERNAME=${TFN_USERNAME:-}
      - TFN_PASSWORD=${TFN_PASSWORD:-}
      - TFN_CUSTOMER_NUMBER=${TFN_CUSTOMER_NUMBER:-}
      - TFN_TIMEOUT=${TFN_TIMEOUT:-15}
      - TFN_TOKEN_REFRESH_BUFFER=${TFN_TOKEN_REFRESH_BUFFER:-60}
      - TFN_CACHE_PREFIX=${TFN_CACHE_PREFIX:-tfn:}
    volumes:
      - app-logs:/var/www/html/storage/logs
      - app-storage:/var/www/html/storage/app
    ports:
      - "${APP_PORT:-8091}:80"
    networks:
      - proselver-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: proselver-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-proselver}
      - POSTGRES_USER=${DB_USERNAME:-proselver}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - proselver-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-proselver}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: proselver-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - proselver-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    image: proselver-app:latest
    container_name: proselver-scheduler
    restart: unless-stopped
    entrypoint: []
    command: sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - APP_NAME=${APP_NAME:-TRIDENT}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://tcdc.co.za}
      - APP_KEY=${APP_KEY}
      - LOG_CHANNEL=stack
      - LOG_STACK=single
      - LOG_LEVEL=warning
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-proselver}
      - DB_USERNAME=${DB_USERNAME:-proselver}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - R2_BACKUP_ACCESS_KEY_ID=${R2_BACKUP_ACCESS_KEY_ID:-}
      - R2_BACKUP_SECRET_ACCESS_KEY=${R2_BACKUP_SECRET_ACCESS_KEY:-}
      - R2_BACKUP_BUCKET=${R2_BACKUP_BUCKET:-}
      - R2_BACKUP_ENDPOINT=${R2_BACKUP_ENDPOINT:-}
      - R2_BACKUP_REGION=${R2_BACKUP_REGION:-auto}
      # TFN — mirrors the app service.  Scheduler needs it for any
      # scheduled reconciliation / vehicle-list refresh commands we
      # add later (nothing today, but flipping this on now costs
      # nothing and prevents a "why is scheduler in demo mode" moment
      # the day we wire the first cron).
      - TFN_ENABLED=${TFN_ENABLED:-false}
      - TFN_DEMO_MODE=${TFN_DEMO_MODE:-true}
      - TFN_BASE_URL=${TFN_BASE_URL:-https://api.tfn.co.za}
      - TFN_API_VERSION=${TFN_API_VERSION:-3}
      - TFN_CLIENT_ID=${TFN_CLIENT_ID:-customerAPI}
      - TFN_USERNAME=${TFN_USERNAME:-}
      - TFN_PASSWORD=${TFN_PASSWORD:-}
      - TFN_CUSTOMER_NUMBER=${TFN_CUSTOMER_NUMBER:-}
      - TFN_TIMEOUT=${TFN_TIMEOUT:-15}
      - TFN_TOKEN_REFRESH_BUFFER=${TFN_TOKEN_REFRESH_BUFFER:-60}
      - TFN_CACHE_PREFIX=${TFN_CACHE_PREFIX:-tfn:}
    volumes:
      - app-logs:/var/www/html/storage/logs
      - app-storage:/var/www/html/storage/app
    networks:
      - proselver-network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    image: proselver-app:latest
    container_name: proselver-queue
    restart: unless-stopped
    entrypoint: []
    command: php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_NAME=${APP_NAME:-TRIDENT}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://tcdc.co.za}
      - APP_KEY=${APP_KEY}
      - LOG_CHANNEL=stack
      - LOG_STACK=single
      - LOG_LEVEL=warning
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-proselver}
      - DB_USERNAME=${DB_USERNAME:-proselver}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@tcdc.co.za}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-TRIDENT Control & Dispatch Center}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK:-local}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_REGION=${R2_REGION:-auto}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-auto}
      - AWS_BUCKET=${AWS_BUCKET:-}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - AWS_USE_PATH_STYLE_ENDPOINT=${AWS_USE_PATH_STYLE_ENDPOINT:-false}
      - COLLECTION_NOTE_PUBLIC_URL=${COLLECTION_NOTE_PUBLIC_URL:-}
      - LIVEWIRE_TEMPORARY_FILE_UPLOAD_DISK=public
      # TFN — mirrors the app service.  Queue needs it for the
      # webhook processor we'll wire later (TFN posts a transaction,
      # we dispatch a Job onto the queue that reconciles it to a
      # TRIDENT Job row).
      - TFN_ENABLED=${TFN_ENABLED:-false}
      - TFN_DEMO_MODE=${TFN_DEMO_MODE:-true}
      - TFN_BASE_URL=${TFN_BASE_URL:-https://api.tfn.co.za}
      - TFN_API_VERSION=${TFN_API_VERSION:-3}
      - TFN_CLIENT_ID=${TFN_CLIENT_ID:-customerAPI}
      - TFN_USERNAME=${TFN_USERNAME:-}
      - TFN_PASSWORD=${TFN_PASSWORD:-}
      - TFN_CUSTOMER_NUMBER=${TFN_CUSTOMER_NUMBER:-}
      - TFN_TIMEOUT=${TFN_TIMEOUT:-15}
      - TFN_TOKEN_REFRESH_BUFFER=${TFN_TOKEN_REFRESH_BUFFER:-60}
      - TFN_CACHE_PREFIX=${TFN_CACHE_PREFIX:-tfn:}
    volumes:
      - app-logs:/var/www/html/storage/logs
      - app-storage:/var/www/html/storage/app
    networks:
      - proselver-network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  proselver-network:
    driver: bridge

volumes:
  app-logs:
  app-storage:
  db-data:
  redis-data:
